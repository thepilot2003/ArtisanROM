name: Build ArtisanROM One UI 9 for Galaxy S20 (x1s)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: "Target Samsung Device"
        required: true
        default: "x1s"
        type: choice
        options:
          - x1s
          - y2s
          - z3s
          - c1s
          - c2s
  push:
    branches:
      - main
      - sixteen-qpr2
      - oneui9-dev
    paths:
      - 'target/x1s/**'
      - 'unica/**'
      - '.github/workflows/build-x1s.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build One UI 9 (${{ inputs.target_device || 'x1s' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu python-is-python3 python3 wget \
            bc bison curl flex git gnupg gperf imagemagick libelf-dev liblz4-tool \
            libncurses6 libncurses-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            brotli zstd libgl1 libfuse2 patchelf e2fsprogs f2fs-tools
          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg
          sudo modprobe erofs f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Global Gradle Repositories
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/plugin-mgmt.init.gradle
          gradle.beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      gradlePluginPortal()
                      mavenCentral()
                      google()
                  }
              }
          }
          allprojects {
              repositories {
                  gradlePluginPortal()
                  mavenCentral()
                  google()
              }
          }
          EOF

      - name: Build dependencies
        run: |
          TARGET="${{ inputs.target_device || 'x1s' }}"
          source ./buildenv.sh "$TARGET"
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: |
            TARGET="${{ inputs.target_device || 'x1s' }}"
            source ./buildenv.sh "$TARGET" && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          TARGET="${{ inputs.target_device || 'x1s' }}"
          source ./buildenv.sh "$TARGET"
          ./scripts/extract_fw.sh

      - name: Set up swap space
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build ROM
        run: |
          TARGET="${{ inputs.target_device || 'x1s' }}"
          source ./buildenv.sh "$TARGET"
          ./scripts/make_rom.sh --beta

      - name: Locate & Verify Built Artifacts
        id: check_output
        run: |
          TARGET="${{ inputs.target_device || 'x1s' }}"
          echo "=== Looking for generated ZIP packages ==="
          ls -lh out/ArtisanROM_*.zip || true
          
          ROM_ZIP=$(find out/ -maxdepth 1 -name "ArtisanROM_*${TARGET}*.zip" | head -n 1)
          if [ -z "$ROM_ZIP" ]; then
            ROM_ZIP=$(find out/ -maxdepth 1 -name "ArtisanROM_*.zip" | head -n 1)
          fi
          
          echo "rom_zip=$ROM_ZIP" >> $GITHUB_OUTPUT
          echo "Found Full ROM: $ROM_ZIP"
          ls -lh "$ROM_ZIP"

      - name: Upload Full ROM Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanROM_OneUI9_${{ inputs.target_device || 'x1s' }}
          path: ${{ steps.check_output.outputs.rom_zip }}
          retention-days: 14
          if-no-files-found: error
